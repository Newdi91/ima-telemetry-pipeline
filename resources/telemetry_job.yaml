resources:
  jobs:
    telemetry_pipeline_job:
      name: "${var.project_name}_medallion_job"
      
      environments:
        - environment_key: serverless_compute
          spec:
            environment_version: "2"
            dependencies:
              - faker

      tasks:
        - task_key: setup_infrastructure
          environment_key: serverless_compute
          spark_python_task:
            python_file: ../src/00_setup_infrastructure.py
            
        - task_key: generate_mock_data
          environment_key: serverless_compute
          depends_on:
            - task_key: setup_infrastructure
          spark_python_task:
            python_file: ../src/01_generate_mock_data.py

        - task_key: bronze_ingestion
          environment_key: serverless_compute
          depends_on:
            - task_key: generate_mock_data
          spark_python_task:
            python_file: ../src/02_bronze_ingestion.py
            
        - task_key: silver_transformation
          environment_key: serverless_compute
          depends_on:
            - task_key: bronze_ingestion
          spark_python_task:
            python_file: ../src/03_silver_transformation.py
            
        - task_key: gold_performance
          environment_key: serverless_compute
          depends_on:
            - task_key: silver_transformation
          spark_python_task:
            python_file: ../src/04_gold_performance.py

        - task_key: gold_mechanical
          environment_key: serverless_compute
          depends_on:
            - task_key: gold_performance
          spark_python_task:
            python_file: ../src/05_gold_mechanical_health.py